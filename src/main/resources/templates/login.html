<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar Sesión | AgroLink</title>

    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>

<body class="min-h-screen bg-linear-to-b from-green-50 to-white flex items-center justify-center p-4">

<div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-xl border border-green-100">

    <a th:href="@{/}" class="text-green-700 mb-6 inline-block hover:text-green-900 transition-colors text-sm font-medium">
        ← Volver al inicio
    </a>

    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-green-800">Iniciar Sesión</h1>
        <p class="text-gray-500 mt-2">Bienvenido a la red agrícola sostenible 🌱</p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6">
        <button class="flex items-center justify-center px-4 py-2 border border-gray-300 rounded-lg shadow-sm bg-white hover:bg-gray-50 transition-all" type="button">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" width="20" class="mr-2" alt="Google">
            <span class="text-sm font-medium text-gray-700">Google</span>
        </button>

        <button class="flex items-center justify-center px-4 py-2 border border-gray-300 rounded-lg shadow-sm bg-white hover:bg-gray-50 transition-all" type="button">
            <img src="https://www.svgrepo.com/show/354141/twitter.svg" width="20" class="mr-2" alt="Twitter">
            <span class="text-sm font-medium text-gray-700">Twitter</span>
        </button>
    </div>

    <div class="relative flex items-center justify-center mb-6">
        <div class="border-t border-gray-200 w-full"></div>
        <span class="bg-white px-3 text-xs text-gray-400 uppercase absolute">o ingresar con email</span>
    </div>

    <form th:action="@{/login}" method="post" class="space-y-4">

        <div th:if="${param.error}" class="p-3 rounded-lg bg-red-50 text-red-700 text-sm border border-red-200">
            Usuario o contraseña incorrectos.
        </div>
        <div th:if="${param.logout}" class="p-3 rounded-lg bg-green-50 text-green-700 text-sm border border-green-200">
            Has cerrado sesión correctamente.
        </div>

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div>
            <label for="username" class="block text-sm font-semibold text-green-800 mb-1">Email / Usuario *</label>
            <input type="text" id="username" name="username"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-hidden transition-all placeholder:text-gray-300"
                   placeholder="usuario@correo.com" autofocus required>
        </div>

        <div>
            <label for="passInput" class="block text-sm font-semibold text-green-800 mb-1">Contraseña *</label>
            <div class="relative">
                <input type="password" name="password" id="passInput"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-hidden transition-all placeholder:text-gray-300"
                       placeholder="Ingresa tu contraseña" required>
                <button class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-green-600"
                        type="button"
                        onclick="const inp = document.getElementById('passInput'); inp.type = inp.type === 'password' ? 'text' : 'password';">
                    👁️
                </button>
            </div>
        </div>

        <div class="flex items-center justify-between text-sm">
            <label class="flex items-center text-green-800 cursor-pointer">
                <input type="checkbox" name="remember-me" class="w-4 h-4 text-green-600 border-gray-300 rounded-sm focus:ring-green-500 mr-2">
                Mantener sesión activa
            </label>
            <a th:href="@{/reset-password}" class="text-green-700 hover:underline font-medium">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="w-full bg-green-700 hover:bg-green-800 text-white font-bold py-3 rounded-lg shadow-md hover:shadow-lg transform active:scale-95 transition-all mt-4">
            Ingresar
        </button>

    </form>

    <p class="mt-8 text-center text-sm text-gray-600">
        ¿No tienes cuenta?
        <a th:href="@{/register}" class="text-green-700 hover:text-green-900 font-bold decoration-2 hover:underline">Crear cuenta</a>
    </p>

</div>

</body>
</html>
